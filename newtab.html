<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Sidebar: clock, weather, search, pinned links and settings. Content: the folder columns. -->
  <div id="sidebar">
    <header id="top">
      <div id="clock"></div>
      <div id="greeting"></div>
      <div id="meta"><span id="date"></span><button id="weather" type="button" hidden aria-expanded="false" aria-controls="forecast" title="Show the forecast"></button></div>
      <div id="forecast" hidden></div>
    </header>

    <div id="searchwrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
      <input id="search" type="search" placeholder="Search bookmarks" aria-label="Search bookmarks" autocomplete="off" spellcheck="false">
      <kbd class="search-key" aria-hidden="true">/</kbd>
    </div>

    <section id="pinned" hidden>
      <h2>Pinned</h2>
      <div id="pinned-list"></div>
    </section>

    <div id="sidebar-foot">
      <button id="settings-btn" type="button" title="Settings" aria-label="Settings">&#9881;</button>
      <button id="collapse-all" type="button" hidden>Collapse all</button>
    </div>
  </div>

  <div id="content">
    <main id="cards"></main>
  </div>

  <div id="editor" hidden>
    <input id="ed-search" type="search" placeholder="Search icons" autocomplete="off" spellcheck="false">
    <div id="ed-icons"></div>
    <div id="ed-colors"></div>
    <div id="ed-actions">
      <button id="ed-reset" type="button">Reset</button>
      <button id="ed-close" type="button">Done</button>
    </div>
  </div>

  <dialog id="bm-dialog" aria-labelledby="bm-heading">
    <form method="dialog">
      <h2 id="bm-heading">Edit bookmark</h2>
      <label>Name <input id="bm-title" type="text" autocomplete="off" spellcheck="false"></label>
      <label>URL <input id="bm-url" type="text" required autocomplete="off" spellcheck="false"></label>
      <div class="bm-actions">
        <button type="submit" value="cancel" formnovalidate>Cancel</button>
        <button type="submit" value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="icons.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
